
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <!-- CSS -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .input-area {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 6px;
            background: #6c63ff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        ul {
            list-style: none;
        }

        li {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f4f4f4;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            overflow-wrap: anywhere;
        }

        li span {
            flex: 1;
            cursor: pointer;
        }

        li.completed span {
            text-decoration: line-through;
            color: #888;
        }

        .deleteBtn {
            background: #ff5252;
        }

        #clearBtn {
            width: 100%;
            margin-top: 10px;
            background: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>My To-Do List 📝</h1>
        <p>Organize your day, one task at a time!</p>

        <div class="input-area">
            <input type="text" id="taskInput"
                   placeholder="Enter a new task...">
            <button id="addBtn">Add</button>
        </div>

        <ul id="taskList"></ul>

        <button id="clearBtn">Clear All</button>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- JavaScript + jQuery -->
    <script>
        $(document).ready(function () {

            // Add a new task
            $("#addBtn").click(function () {
                let task = $("#taskInput").val().trim();

                if (task === "") {
                    alert("Please enter a task!");
                    return;
                }

                let $item = $("<li>");
                let $text = $("<span>").text(task);
                let $delete = $("<button>")
                    .text("Delete")
                    .addClass("deleteBtn");

                $item.append($text, $delete);
                $("#taskList").append($item);

                $("#taskInput").val("");
            });

            // Add task by pressing Enter
            $("#taskInput").keypress(function (event) {
                if (event.which === 13) {
                    $("#addBtn").click();
                }
            });

            // Mark task as completed
            $("#taskList").on("click", "span", function () {
                $(this).parent().toggleClass("completed");
            });

            // Delete one task
            $("#taskList").on("click", ".deleteBtn", function () {
                $(this).parent().remove();
            });

            // Delete all tasks
            $("#clearBtn").click(function () {
                $("#taskList").empty();
            });

        });
    </script>

</body>
</html>
